<!-- Loading State -->
<div
  *ngIf="isLoading"
  class="file-loading">
  <nz-spin nzTip="Loading file...">
    <nz-alert
      nzType="info"
      nzMessage="Loading file content"></nz-alert>
  </nz-spin>
</div>

<!-- Show file content if it exists and is editable -->
<div
  *ngIf="!isLoading && fileExists && isEditable()"
  class="file-content">
  <div
    *ngIf="isEditMode"
    class="file-expanded">
    <div class="file-header">
      <div class="file-title-section">
        <h4 class="file-title">
          <i
            nz-icon
            [nzType]="fileType === 'markdown' ? 'file-markdown' : 'file-text'"></i>
          {{ getFileName() }}
        </h4>
      </div>

      <div class="file-controls">
        <!-- Unsaved changes indicator -->
        <span
          *ngIf="hasUnsavedChanges()"
          class="unsaved-indicator">
          <i
            nz-icon
            nzType="edit"
            nzTheme="fill"></i>
          Unsaved changes
        </span>

        <!-- Save/Cancel buttons -->
        <nz-button-group>
          <button
            nz-button
            nzType="primary"
            nzSize="small"
            [disabled]="!hasUnsavedChanges()"
            (click)="saveFile()">
            <i
              nz-icon
              nzType="check"></i>
            Save
          </button>
          <button
            nz-button
            nzType="default"
            nzSize="small"
            (click)="cancelEditing()">
            <i
              nz-icon
              nzType="close"></i>
            Cancel
          </button>
        </nz-button-group>
      </div>
    </div>

    <!-- File Editor Mode -->
    <div
      *ngIf="isEditMode"
      class="file-editor-container">
      <!-- Markdown Editor -->
      <div
        *ngIf="fileType === 'markdown'"
        class="markdown-editor-wrapper">
        <angular-markdown-editor
          textareaId="markdownEditor"
          [options]="editorOptions"
          name="editingContent"
          [(ngModel)]="editingContent"
          (onChange)="onMarkdownEditorChange($event)"
          class="enhanced-markdown-editor">
        </angular-markdown-editor>
      </div>

      <!-- Text Editor -->
      <div
        *ngIf="fileType === 'text'"
        class="simple-editor">
        <textarea
          #fileTextarea
          [(ngModel)]="editingContent"
          class="file-textarea text-editor"
          [placeholder]="'Edit ' + getFileName() + ' content...'"
          spellcheck="false"
          (keydown)="onEditorKeydown($event)">
        </textarea>
      </div>
    </div>
  </div>
</div>
